<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Site locked</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <main class="lock">
    <p class="clock" id="clock" aria-hidden="true"></p>

    <div class="badge" aria-hidden="true">
      <img id="favicon" class="site-icon" alt="">
      <span class="padlock">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
      </span>
    </div>

    <h1 id="site">This site is locked</h1>
    <p class="muted" id="hint">Enter your password to open it.</p>

    <form id="form" class="pw" autocomplete="off">
      <label class="visually-hidden" for="password">Password</label>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" spellcheck="false" autofocus required>
      <button id="submit" type="submit" aria-label="Unlock">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p id="error" class="error" role="alert"></p>
  </main>

  <p class="footer muted">Locked by Site Lock. Your password never leaves this device.</p>
  <script type="module" src="lock.js"></script>
</body>
</html>
